name: Deploy backend (Coolify homelab)

# Triggers a Coolify deployment of the Django API on pushes to master that touch
# the backend. Coolify runs on the homelab, so this calls its deploy API with a
# token stored in repo secrets.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   COOLIFY_URL            e.g. https://coolify.idontcook.app   (no trailing slash)
#   COOLIFY_TOKEN          a Coolify API token (Keys & Tokens → API tokens)
#   COOLIFY_RESOURCE_UUID  the backend resource's UUID (from its Coolify URL)
#
# NOTE: GitHub-hosted runners live in the cloud, so COOLIFY_URL must be reachable
# from the public internet (a tunnel/ingress domain). If the homelab Coolify is
# LAN-only, use a self-hosted runner on the homelab instead:  runs-on: self-hosted

on:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        run: |
          curl --fail --silent --show-error \
            --request GET \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_RESOURCE_UUID}&force=false" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}"
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
