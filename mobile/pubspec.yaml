name: mobile
description: A Flutter project for your Recipe App

publish_to: 'none' # Remove this line if you want to publish the package

version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Dependencies for API requests and state management
  http: ^1.3.0
  provider: ^6.0.3
  riverpod: ^2.0.0
  flutter_riverpod: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.1.7
  json_serializable: ^6.0.0
  freezed: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/  # If you plan to include assets like images, sounds, etc.
