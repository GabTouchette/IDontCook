name: i_cant_cook
description: A Recipe app that helps you create, find and share recipes.

version: 1.2.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.24.4"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  provider: ^6.0.3
  font_awesome_flutter: ^11.0.0
  freezed_annotation: ^2.0.0
  json_serializable: ^6.0.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.0.9
  image_picker: ^1.0.7
  camera: ^0.11.0+2
  path_provider: ^2.0.10
  mime: ^2.0.0
  flutter_markdown: ^0.6.17
  google_fonts: ^8.0.0
  dotted_border: ^2.1.0
  google_sign_in: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_slidable: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.1.7
  freezed: ^2.3.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
