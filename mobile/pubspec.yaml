name: mobile
description: A Flutter project for your Recipe App

publish_to: 'none' # Remove this line if you want to publish the package

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.3.0
  provider: ^6.0.3
  riverpod: ^2.0.0
  flutter_riverpod: ^2.0.0
  font_awesome_flutter: ^10.1.0
  freezed_annotation: ^2.0.0
  json_serializable: ^6.0.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.0.9
  image_picker: ^1.0.7
  camera: ^0.11.0+2
  path_provider: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.1.7
  freezed: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

fonts:
  - family: Poppins
    fonts:
      - asset: assets/fonts/Poppins-Regular.ttf
      - asset: assets/fonts/Poppins-Bold.ttf
        weight: 700
